name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    # Vraie base PostgreSQL pour les tests de migration et de dépôt (tests/test_db.py).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gazette
          POSTGRES_PASSWORD: gazette
          POSTGRES_DB: gazette_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gazette"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GAZETTE_TEST_DATABASE_URL: postgresql://gazette:gazette@localhost:5432/gazette_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dépendances
        run: pip install -r requirements-dev.txt -e .
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (sans réseau ; base PostgreSQL du service)
        run: pytest -rs

  docker:
    name: docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Construire l'image Airflow
        run: docker compose build
      - name: Vérifier le DAG dans l'image
        run: >
          docker compose run --rm --no-deps -T
          -v "$PWD/tests:/opt/gazette/tests:ro"
          --entrypoint python airflow-scheduler /opt/gazette/tests/check_dag.py
