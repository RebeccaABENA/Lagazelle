name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dépendances
        run: pip install -r requirements-dev.txt -e .
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (sans réseau)
        run: pytest

  docker:
    name: docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Construire l'image Airflow
        run: docker compose build
      - name: Vérifier le DAG dans l'image
        run: >
          docker compose run --rm --no-deps -T
          -v "$PWD/tests:/opt/gazette/tests:ro"
          --entrypoint python airflow-scheduler /opt/gazette/tests/check_dag.py
