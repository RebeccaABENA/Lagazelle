[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gazette"
version = "0.1.0"
description = "La gazette : collecte quotidienne des flux RSS de la presse PQR/PQN"
readme = "README.md"
requires-python = ">=3.12"
# Versions exactes épinglées dans requirements.txt ; ici, des bornes compatibles.
dependencies = [
    "feedparser>=6.0,<7",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "tzdata",
]

[project.scripts]
gazette = "gazette.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gazette.db" = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["logs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
