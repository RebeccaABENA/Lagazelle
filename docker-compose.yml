# La gazette — pile locale : PostgreSQL 16 (pgvector) + Airflow 3 en LocalExecutor.
# Inspiré du docker-compose officiel d'Airflow 3.3.2, sans Celery ni Redis ni triggerer.

x-airflow-common: &airflow-common
  build: .
  image: la-gazette-airflow:3.3.2
  env_file:
    - path: .env
      required: false
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-local-only}
    AIRFLOW__API_AUTH__JWT_ISSUER: la-gazette
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Machine d'étudiant (8 Go) : on limite le parallélisme et les workers HTTP.
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__API__WORKERS: "1"
    # Un seul DAG, qui change rarement : le reparser toutes les 2 min suffit (CPU au repos).
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "120"
    # Au démarrage à froid, l'API d'exécution a mis ~40 s à répondre (défaut : 5 s) :
    # le superviseur tuait alors les tâches avant leur démarrage (runs du 21/10 08:40 et 10:00).
    AIRFLOW__WORKERS__EXECUTION_API_TIMEOUT: "60"
    # Chemins du paquet gazette dans le conteneur (prioritaires sur .env).
    GAZETTE_DATA_DIR: /opt/gazette/data
    GAZETTE_SOURCES_FILE: /opt/gazette/sources.csv
    GAZETTE_DATABASE_URL: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/gazette
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/gazette/data
    - ./sources.csv:/opt/gazette/sources.csv:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Exposé sur 5433 (et pas 5432, souvent pris par un PostgreSQL local) pour `make collect`.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      # Démarrage à froid mesuré à ~3,5 min sur une machine 8 Go : le scheduler et
      # le dag-processor l'attendent, il ne doit pas être déclaré unhealthy trop tôt.
      start_period: 300s
      start_interval: 10s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      # Les tâches s'enregistrent auprès de l'API d'exécution dès leur lancement.
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      # Les tâches s'enregistrent auprès de l'API d'exécution dès leur lancement.
      airflow-apiserver:
        condition: service_healthy

  # Migration de la base, création du compte admin, droits sur les volumes. S'arrête ensuite.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        mkdir -p /opt/airflow/logs /opt/gazette/data/raw /opt/gazette/data/state
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/gazette/data
        /entrypoint airflow version
        echo "Base gazette : migrations et amorçage de la table sources"
        python -m gazette db migrate
        python -m gazette db seed --csv /opt/gazette/sources.csv
        echo "Pool Airflow gazette_editeurs (1 place : jamais 2 requêtes simultanées vers un éditeur)"
        /entrypoint airflow pools set gazette_editeurs 1 "Collecte : une source à la fois"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    user: "0:0"

volumes:
  postgres-db-volume:
